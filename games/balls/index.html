<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Balls · Arena 1v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --bg:#070b10;
  --surface:rgba(15,23,31,.82);
  --surface-2:rgba(21,32,42,.92);
  --border:rgba(148,184,209,.15);
  --border-hi:rgba(187,247,147,.42);
  --text:#f0f7fa;
  --muted:#8da4b5;
  --accent:#bbf793;
  --emerald:#3ce89e;
  --enemy:#ff7f6b;
  --net:#5cb8ff;
  --kirk:#f5b963;
  --font:'Space Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace;
}
html,body{margin:0;padding:0}
body{
  min-height:100svh;
  display:grid;
  place-items:center;
  background:
    radial-gradient(ellipse 68% 48% at 15% -6%,rgba(34,116,96,.30),transparent 65%),
    radial-gradient(ellipse 58% 44% at 88% 0%,rgba(38,94,162,.28),transparent 62%),
    radial-gradient(ellipse 55% 40% at 50% 108%,rgba(122,74,34,.15),transparent 65%),
    var(--bg);
  color:var(--text);
  font:15px/1.45 var(--font);
  -webkit-font-smoothing:antialiased;
}
main{
  width:min(95vw,1180px);
  padding:20px 0 28px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* Top Bar */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
  padding:12px 16px;
  border-radius:18px;
  background:var(--surface);
  backdrop-filter:blur(14px);
  border:1px solid var(--border);
  border-top-color:rgba(255,255,255,.11);
  box-shadow:0 12px 34px rgba(0,0,0,.38);
}
.brand{display:flex;align-items:center;gap:13px}
.brand-mark{
  width:42px;height:42px;border-radius:12px;
  display:grid;place-items:center;
  background:linear-gradient(145deg,#1d3330,#0f1d24);
  border:1px solid rgba(187,247,147,.32);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px rgba(60,232,158,.18);
  flex-shrink:0;
}
.brand-text{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{
  font:800 italic clamp(30px,4.5vw,42px)/.95 var(--font);
  letter-spacing:-.055em;
  margin:0;
  background:linear-gradient(135deg,#ffffff 15%,#bbf793 65%,#5ce8b0 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.arena-tag{
  display:inline-flex;align-items:center;gap:6px;
  color:#b6cbd9;letter-spacing:.16em;font-size:10px;font-weight:700;
  padding:4px 10px;border:1px solid var(--border);border-radius:999px;
  background:rgba(10,16,22,.72);text-transform:uppercase;
}
.live-dot{
  width:6px;height:6px;border-radius:50%;background:var(--emerald);
  box-shadow:0 0 8px var(--emerald);
}

.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
button{
  border:1px solid rgba(148,184,209,.22);
  background:rgba(24,35,46,.9);
  color:var(--text);
  padding:10px 16px;
  border-radius:11px;
  font:700 13.5px/1 var(--font);
  cursor:pointer;
  touch-action:none;
  transition:transform .14s ease,border-color .14s ease,background .14s ease,box-shadow .14s ease,color .14s ease;
}
button:hover,button:focus-visible{
  border-color:rgba(187,247,147,.6);
  outline:none;
  transform:translateY(-1px);
}
.mode-group{
  display:inline-flex;
  padding:4px;
  gap:4px;
  border-radius:13px;
  background:rgba(8,13,18,.78);
  border:1px solid var(--border);
}
.mode-group button{
  border:1px solid transparent;
  background:transparent;
  color:#b7cbd8;
  padding:9px 16px;
  border-radius:9px;
  display:inline-flex;align-items:center;gap:7px;
}
.mode-group button:hover{color:#fff;background:rgba(255,255,255,.05);transform:none}
.mode-group button[aria-pressed=true]{
  background:linear-gradient(135deg,#c9ff9e,#7bf0a8);
  color:#091810;
  box-shadow:0 4px 16px rgba(139,245,158,.32);
}
#sfxBtn{
  padding:9px 12px;
  font-size:12.5px;
  color:#bfd2df;
  background:rgba(14,22,30,.75);
  display:inline-flex;align-items:center;gap:6px;
}
#sfxBtn[aria-pressed=false]{opacity:.6}

/* Fighter Roster Panel */
.picker{
  background:var(--surface);
  backdrop-filter:blur(14px);
  border:1px solid var(--border);
  border-top-color:rgba(255,255,255,.1);
  border-radius:18px;
  padding:14px 16px 16px;
  box-shadow:0 12px 34px rgba(0,0,0,.35);
}
.picker-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:12px;flex-wrap:wrap;
}
.picker-left{display:flex;align-items:center;gap:10px}
.picker-title{
  font-size:11px;font-weight:700;letter-spacing:.17em;
  text-transform:uppercase;color:#a5bccb;
}
.roster-count{
  font:700 10.5px/1 var(--mono);
  color:#7993a6;
  padding:4px 8px;border-radius:6px;
  background:rgba(8,14,20,.65);
  border:1px solid var(--border);
}
.picker-note{font-size:12px;color:#86ceff;font-weight:600}

.fighters{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:11px;
}
.fighter-card{
  position:relative;
  overflow:hidden;
  display:grid;
  grid-template-columns:66px minmax(0,1fr);
  align-items:center;
  gap:14px;
  text-align:left;
  padding:12px 14px;
  border-radius:14px;
  border:1px solid rgba(148,184,209,.15);
  background:linear-gradient(155deg,rgba(23,35,46,.82),rgba(13,20,27,.9));
  color:var(--text);
  font-weight:500;
  line-height:1.35;
}
.fighter-card::before{
  content:'';
  position:absolute;inset:0 0 auto 0;height:2px;
  background:linear-gradient(90deg,transparent,var(--card-accent,var(--accent)),transparent);
  opacity:0;transition:opacity .18s ease;
}
.fighter-card:hover,.fighter-card:focus-visible{
  border-color:rgba(162,199,222,.36);
  background:linear-gradient(155deg,rgba(29,44,58,.9),rgba(16,25,34,.95));
  transform:translateY(-2px);
}
.fighter-card[aria-pressed=true]{
  border-color:color-mix(in srgb,var(--card-accent,var(--accent)) 75%,transparent);
  background:
    radial-gradient(circle at 10% 18%,color-mix(in srgb,var(--card-accent,var(--accent)) 18%,transparent),transparent 62%),
    linear-gradient(155deg,rgba(26,41,53,.95),rgba(14,22,30,.98));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--card-accent,var(--accent)) 28%,transparent),0 12px 26px rgba(0,0,0,.42);
}
.fighter-card[aria-pressed=true]::before{opacity:1}

.fighter-card[data-fighter=floyd]{--card-accent:#3ce89e}
.fighter-card[data-fighter=net]{--card-accent:#5cb8ff}
.fighter-card[data-fighter=kirk]{--card-accent:#f5b963}
.fighter-card[data-fighter=classic]{--card-accent:#bbf793}

.avatar-wrap{
  position:relative;
  width:62px;height:62px;border-radius:50%;
  display:grid;place-items:center;flex-shrink:0;
}
.avatar-img{
  width:100%;height:100%;border-radius:50%;
  object-fit:cover;display:block;
}
.fighter-card[data-fighter=floyd] .avatar-wrap{
  background:conic-gradient(from 160deg,#e4fff0,#3ce89e,#0c5440,#6cf7be,#e4fff0);
  padding:3px;
  box-shadow:0 0 18px rgba(60,232,158,.38),0 6px 14px rgba(0,0,0,.5);
}
.fighter-card[data-fighter=floyd] .avatar-img{border:1.5px solid #082a20}
.fighter-card[data-fighter=floyd] .avatar-badge{
  background:linear-gradient(145deg,#1ca66d,#0b4d34);
  border-color:#aaffd8;
}
.fighter-card[data-fighter=net] .avatar-wrap{
  background:conic-gradient(from 210deg,#e9f7ff,#4fa8ff,#174a96,#78c6ff,#e9f7ff);
  padding:3px;
  box-shadow:0 0 18px rgba(77,168,255,.38),0 6px 14px rgba(0,0,0,.5);
}
.fighter-card[data-fighter=net] .avatar-img{border:1.5px solid #0c2240}
.fighter-card[data-fighter=kirk] .avatar-wrap{
  background:conic-gradient(from 190deg,#fff3cf,#f5b963,#8e3529,#f8ce7c,#fff3cf);
  padding:3px;
  box-shadow:0 0 18px rgba(245,185,99,.34),0 6px 14px rgba(0,0,0,.5);
}
.fighter-card[data-fighter=kirk] .avatar-img{border:1.5px solid #3c1812}
.fighter-card[data-fighter=kirk] .avatar-badge{
  background:linear-gradient(145deg,#b5671c,#6a2719);
  border-color:#ffe3a8;font-size:11px;
}
.avatar-badge{
  position:absolute;right:-3px;bottom:-2px;
  width:22px;height:22px;border-radius:50%;
  background:linear-gradient(145deg,#1f66c4,#0e3168);
  border:1.5px solid #bce4ff;color:#f0f9ff;
  display:grid;place-items:center;font-size:11.5px;line-height:1;
  box-shadow:0 3px 8px rgba(0,0,0,.6);
}
.avatar-orb{
  width:58px;height:58px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#ffffff 0%,#afff8c 28%,#244e39 100%);
  border:2px solid #88dc7a;
  box-shadow:0 0 16px rgba(175,255,140,.28),0 6px 14px rgba(0,0,0,.5);
}

.fighter-info{min-width:0}
.fighter-top{
  display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;
}
.fighter-titles{min-width:0}
.fighter-role{
  display:block;
  font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--card-accent,var(--accent));opacity:.9;
}
.fighter-name{
  font-size:15.5px;font-weight:700;color:#f6fbfd;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;
}
.selected-pill{
  font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;
  background:var(--card-accent,var(--accent));color:#081611;
  opacity:0;transform:scale(.88);
  transition:opacity .15s ease,transform .15s ease;flex-shrink:0;
}
.fighter-card[aria-pressed=true] .selected-pill{opacity:1;transform:scale(1)}

.stats{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px}
.stat{
  font:700 10.5px/1 var(--mono);
  padding:4px 7px;border-radius:6px;
  background:rgba(8,14,20,.72);
  border:1px solid rgba(148,184,209,.15);
  color:#cfe2ee;
}
.stat.hp{color:#8bf3aa;border-color:rgba(60,232,158,.28)}
.stat.em{color:#5ef2bc;border-color:rgba(60,232,158,.32)}
.stat.spec{color:#81caff;border-color:rgba(92,184,255,.3)}
.stat.tea{color:#f8ca74;border-color:rgba(245,185,99,.32)}

.fighter-desc{margin:0;font-size:12px;color:var(--muted);line-height:1.38}
.hp-bar{
  margin-top:7px;height:4px;border-radius:999px;
  background:rgba(255,255,255,.07);overflow:hidden;
}
.hp-bar>span{
  display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--card-accent,var(--accent)),#f0fff2);
}

/* Broadcast Arena Shell */
.arena-shell{
  background:var(--surface);
  backdrop-filter:blur(14px);
  border:1px solid var(--border);
  border-top-color:rgba(255,255,255,.1);
  border-radius:20px;
  padding:14px 16px 16px;
  box-shadow:0 18px 46px rgba(0,0,0,.45);
}

/* Esports VS Scoreboard */
.vs-hud{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;
  gap:14px;
  margin-bottom:10px;
}
.plate{
  display:grid;
  grid-template-columns:40px minmax(0,1fr);
  align-items:center;
  gap:10px;
}
.plate.enemy{
  grid-template-columns:minmax(0,1fr) 40px;
  text-align:right;
}
.hud-avatar{
  width:40px;height:40px;border-radius:50%;
  border:2px solid var(--accent);
  background:radial-gradient(circle at 32% 28%,#fff,#afff8c 32%,#28513c);
  overflow:hidden;display:grid;place-items:center;
  box-shadow:0 4px 12px rgba(0,0,0,.4);
}
.plate.enemy .hud-avatar{
  border-color:var(--enemy);
  background:radial-gradient(circle at 32% 28%,#fff,#ff977b 32%,#77332f);
}
.hud-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.plate-meta{min-width:0}
.plate-row{
  display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  margin-bottom:5px;
}
.plate.enemy .plate-row{flex-direction:row-reverse}
.plate-name{
  font-size:13.5px;font-weight:700;color:#eef7fa;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.plate-hp{
  font:800 12.5px/1 var(--mono);color:#aaf5a0;flex-shrink:0;
}
.plate.enemy .plate-hp{color:#ffa08d}

.bar-track{
  position:relative;height:10px;border-radius:999px;
  background:rgba(7,12,18,.88);
  border:1px solid rgba(255,255,255,.08);
  overflow:hidden;
}
.bar-ghost,.bar-fill{
  position:absolute;top:0;bottom:0;left:0;border-radius:999px;
}
.plate.enemy .bar-ghost,.plate.enemy .bar-fill{left:auto;right:0}
.bar-ghost{
  background:rgba(255,244,200,.62);
  transition:width .55s cubic-bezier(.22,1,.36,1);
}
.bar-fill{
  background:linear-gradient(90deg,#3de89e,#bbf793);
  box-shadow:0 0 12px rgba(105,242,163,.45);
  transition:width .12s ease-out;
}
.plate.enemy .bar-fill{
  background:linear-gradient(270deg,#ff5e57,#ffa07a);
  box-shadow:0 0 12px rgba(255,115,96,.4);
}

.phase-pill{
  font:800 11px/1 var(--mono);
  letter-spacing:.12em;text-transform:uppercase;
  padding:8px 13px;border-radius:999px;
  background:rgba(10,17,24,.9);
  border:1px solid var(--border);
  color:#b9cedb;
  white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
}
.phase-pill.aim{color:#d8ffb6;border-color:rgba(187,247,147,.45);box-shadow:0 0 16px rgba(187,247,147,.16)}
.phase-pill.live{color:#86d3ff;border-color:rgba(92,184,255,.45);box-shadow:0 0 16px rgba(92,184,255,.18)}
.phase-pill.done{color:#ffd87c;border-color:rgba(245,185,99,.5)}

/* Ability Telemetry Strip */
.ability-strip{
  min-height:32px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:6px 12px;margin-bottom:10px;
  border-radius:10px;
  background:rgba(8,14,20,.65);
  border:1px solid rgba(148,184,209,.12);
  font-size:12.5px;font-weight:600;color:#b8d0df;
}
.pips{display:inline-flex;align-items:center;gap:4px;vertical-align:middle}
.pip{
  width:11px;height:7px;border-radius:3px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.08);
  transition:background .15s ease,box-shadow .15s ease;
}
.pip.on{background:#3ce89e;border-color:#98ffd0;box-shadow:0 0 8px rgba(60,232,158,.55)}
.pip.max{background:#ffe57a;border-color:#fff5c4;box-shadow:0 0 10px rgba(255,224,102,.7)}
.star-pip{font-size:14px;line-height:1;color:rgba(255,255,255,.18)}
.star-pip.on{color:#6cc8ff;text-shadow:0 0 10px rgba(92,184,255,.8)}
.chip{
  font:700 11px/1 var(--mono);
  padding:4px 8px;border-radius:6px;
  background:rgba(60,232,158,.12);border:1px solid rgba(60,232,158,.32);color:#7bf5bd;
}
.chip.warn{background:rgba(245,185,99,.16);border-color:rgba(245,185,99,.42);color:#ffdc8a}
.chip.blue{background:rgba(92,184,255,.16);border-color:rgba(92,184,255,.42);color:#98d7ff}
.chip.neg{background:rgba(255,127,107,.14);border-color:rgba(255,127,107,.35);color:#ffa494}

/* Arena Canvas + Victory Overlay */
.stage{
  position:relative;
  border-radius:16px;
  overflow:hidden;
  border:1.5px solid rgba(114,154,178,.32);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 18px 42px rgba(0,0,0,.55);
}
canvas{
  touch-action:none;
  display:block;
  width:100%;
  background:
    radial-gradient(ellipse 80% 70% at 50% 50%,#16242d 0%,#0c151c 72%,#081016 100%);
}
.result-overlay{
  position:absolute;inset:0;
  display:grid;place-items:center;
  padding:20px;
  background:rgba(6,11,16,.58);
  backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;
  transition:opacity .24s ease;
}
.result-overlay.show{opacity:1;pointer-events:auto}
.result-card{
  width:min(92%,400px);
  text-align:center;
  padding:24px 24px 22px;
  border-radius:18px;
  background:linear-gradient(165deg,rgba(19,30,40,.95),rgba(10,17,24,.97));
  border:1px solid rgba(187,247,147,.32);
  box-shadow:0 24px 60px rgba(0,0,0,.65);
}
.result-card.lose{border-color:rgba(255,127,107,.42)}
.result-card.draw{border-color:rgba(245,185,99,.42)}
.result-kicker{
  font:800 10.5px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px;
}
.result-title{
  margin:0 0 6px;
  font:800 italic 32px/1.05 var(--font);letter-spacing:-.04em;
  color:var(--accent);
}
.result-card.lose .result-title{color:var(--enemy)}
.result-card.draw .result-title{color:var(--kirk)}
.result-sub{margin:0 0 18px;font-size:13.5px;color:#b4c8d7}
.result-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.btn-primary{
  background:linear-gradient(135deg,#c9ff9e,#62eb9d);
  color:#081710;border-color:transparent;
  padding:11px 20px;
  box-shadow:0 8px 24px rgba(105,240,158,.28);
}
.btn-primary:hover{box-shadow:0 10px 28px rgba(105,240,158,.42)}

.arena-foot{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin-top:11px;
}
#status{margin:0;font-weight:700;font-size:13.5px;color:#dcecf5}
.hint{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px}
kbd{
  font:700 11px/1 var(--mono);
  padding:3px 6px;border-radius:5px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.16);
  color:#e4f2f8;
}

@media (max-width:820px){
  .fighters{grid-template-columns:1fr}
  .vs-hud{grid-template-columns:1fr;gap:10px}
  .phase-pill{justify-self:center;order:-1}
  .plate.enemy{grid-template-columns:40px minmax(0,1fr);text-align:left}
  .plate.enemy .plate-row{flex-direction:row}
  .plate.enemy .bar-ghost,.plate.enemy .bar-fill{left:0;right:auto}
}
@media (pointer:coarse){
  .hint{display:none}
}
</style>
</head>
<body>
<main>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <circle cx="9.5" cy="12" r="5.5" fill="url(#g1)"/>
          <circle cx="15.5" cy="12" r="4.5" stroke="#ff957b" stroke-width="1.8" fill="rgba(255,149,123,.2)"/>
          <defs>
            <radialGradient id="g1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(7.5 9.5) rotate(45) scale(9)">
              <stop stop-color="#ffffff"/><stop offset=".35" stop-color="#bbf793"/><stop offset="1" stop-color="#1d6e50"/>
            </radialGradient>
          </defs>
        </svg>
      </div>
      <div class="brand-text">
        <h1>Balls</h1>
        <span class="arena-tag"><span class="live-dot"></span>ARENA · 1 NA 1</span>
      </div>
    </div>
    <div class="controls">
      <button id="sfxBtn" type="button" aria-pressed="true" title="Włącz lub wyłącz dźwięki">🔊 Dźwięk</button>
      <nav class="mode-group" aria-label="Tryb gry">
        <button id="solo" type="button">⚔️ Graj solo</button>
        <button id="online" type="button">🌐 Graj online</button>
      </nav>
    </div>
  </header>

  <section class="picker" aria-label="Wybór postaci">
    <div class="picker-head">
      <div class="picker-left">

const FIGHTER_IDS=['floyd','net','kirk','classic'];
const FIGHTER_NAMES={floyd:'George Floyd',net:'Benjamin Netanjahu',kirk:'Charlie Kirk',classic:'Klasyczna kulka'};
function fighterId(p){return p.net?'net':p.kirk?'kirk':p.floyd?'floyd':'classic';}
function fighterLabel(p){return FIGHTER_NAMES[fighterId(p)];}

function beep(freq,dur=.09,type='sine',vol=.06,endFreq=null){
 if(!sfxOn)return;
 try{
  if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;
  o.type=type;o.frequency.setValueAtTime(freq,t);
  if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur);
 }catch{}
}
sfxBtn.onclick=()=>{sfxOn=!sfxOn;sfxBtn.setAttribute('aria-pressed',String(sfxOn));sfxBtn.textContent=sfxOn?'🔊 Dźwięk':'🔇 Wyciszony';};

function spawnSparks(x,y,color,count=12,speed=4.2){
 for(let k=0;k<count;k++){
  const a=Math.random()*Math.PI*2,v=speed*(.45+Math.random()*.9);
  sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,color,life:14+Math.random()*10,max:24,r:1.8+Math.random()*2.2});
 }
}

function setHudAvatar(el,p,index){
 const id=fighterId(p);
 if(lastAvatarKey[index]===id)return;
 lastAvatarKey[index]=id;
 if(id==='floyd')el.innerHTML='<img src="'+face.src+'" alt="George Floyd">';
 else if(id==='net')el.innerHTML='<img src="/games/balls/netanjahu.png" alt="Benjamin Netanjahu">';
 else if(id==='kirk')el.innerHTML='<img src="/games/balls/kirk.png" alt="Charlie Kirk">';
 else el.innerHTML='';
}

function drawArenaCourt(){
 ctx.save();
 ctx.fillStyle='rgba(124,162,188,0.11)';
 for(let x=24;x<800;x+=28){
  for(let y=24;y<480;y+=28){
   ctx.fillRect(x,y,1.4,1.4);
  }
 }
 ctx.strokeStyle='rgba(130,175,204,0.12)';
 ctx.lineWidth=1.2;
 ctx.beginPath();ctx.moveTo(400,18);ctx.lineTo(400,462);ctx.stroke();
 ctx.beginPath();ctx.arc(400,240,68,0,Math.PI*2);ctx.stroke();
 ctx.strokeStyle='rgba(130,175,204,0.07)';
 ctx.beginPath();ctx.arc(400,240,124,0,Math.PI*2);ctx.stroke();
 ctx.strokeStyle='rgba(187,247,147,0.18)';ctx.lineWidth=2;
 for(const [cx,cy,sx,sy] of [[16,16,1,1],[784,16,-1,1],[16,464,1,-1],[784,464,-1,-1]]){
  ctx.beginPath();ctx.moveTo(cx+sx*20,cy);ctx.lineTo(cx,cy);ctx.lineTo(cx,cy+sy*20);ctx.stroke();
 }
 ctx.restore();
}

function drawCapsule(item,floydPos,now){
 ctx.save();
 if(!item.flight){
  const d=Math.hypot(floydPos.x-item.x,floydPos.y-item.y);
  if(d<145){
   const pullAlpha=(1-d/145)*.55;
   ctx.strokeStyle=`rgba(72,245,176,${pullAlpha})`;

   ctx.beginPath();ctx.moveTo(item.x,item.y);ctx.lineTo(floydPos.x,floydPos.y);ctx.stroke();
   ctx.setLineDash([]);
  }
  const pulse=.5+.5*Math.sin(now*.008+item.x);
  ctx.strokeStyle=`rgba(60,232,158,${.22+.28*pulse})`;
  ctx.lineWidth=1.6;

 }
 ctx.translate(item.x,item.y);
 ctx.rotate(item.flight?Math.atan2(item.ty-item.sy,item.tx-item.sx):-.75+Math.sin(now*.004+item.x)*.12);
 if(item.flight){
  const trail=ctx.createLinearGradient(-26,0,-6,0);
  trail.addColorStop(0,'rgba(60,232,158,0)');
  trail.addColorStop(1,'rgba(110,247,212,0.85)');
  ctx.strokeStyle=trail;ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-26,0);ctx.lineTo(-6,0);ctx.stroke();
 }
 ctx.shadowColor='#3ce89e';ctx.shadowBlur=12;
 ctx.fillStyle='#1ec889';
 ctx.beginPath();ctx.roundRect(-8.5,-4.4,17,8.8,4.4);ctx.fill();

 ctx.beginPath();ctx.roundRect(-8.5,-4.4,17,8.8,4.4);ctx.clip();
 ctx.fillStyle='#2aa8ff';
 ctx.fillRect(0,-5,10,10);
 ctx.fillStyle='rgba(255,255,255,0.42)';
 ctx.fillRect(-7,-3.4,14,2.1);
 ctx.restore();
 ctx.strokeStyle='#b6ffe2';ctx.lineWidth=1.1;
 ctx.beginPath();ctx.roundRect(-8.5,-4.4,17,8.8,4.4);ctx.stroke();

}

function drawFloydPulse(pulse){
 const prog=1-pulse.ttl/(pulse.max||22);
 const alpha=Math.min(1,pulse.ttl/10);
 const curR=pulse.r+(pulse.maxR-pulse.r)*prog;
 ctx.save();
 const grad=ctx.createRadialGradient(pulse.x,pulse.y,Math.max(1,curR-36),pulse.x,pulse.y,curR);
 grad.addColorStop(0,'rgba(60,232,158,0)');
 grad.addColorStop(.65,`rgba(60,232,158,${.38*alpha})`);
 grad.addColorStop(1,`rgba(204,255,232,${.75*alpha})`);
 ctx.fillStyle=grad;
 ctx.beginPath();ctx.arc(pulse.x,pulse.y,curR,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle=`rgba(180,255,222,${.9*alpha})`;
 ctx.lineWidth=4*alpha;ctx.shadowColor='#3ce89e';ctx.shadowBlur=18;
 ctx.beginPath();ctx.arc(pulse.x,pulse.y,curR,0,Math.PI*2);ctx.stroke();
 ctx.restore();
}

function drawPickupText(anim){

 const rise=(1-anim.ttl/(anim.max||24))*28;

 ctx.textAlign='center';
 ctx.shadowColor='rgba(0,0,0,0.85)';ctx.shadowBlur=6;
 ctx.fillStyle=anim.label.includes('MAX')?'#ffe67a':'#98ffd2';
 ctx.fillText(anim.label,anim.x,anim.y-52-rise);
 ctx.restore();
}

  ctx.strokeStyle=color;ctx.lineWidth=width;

function drawTeaCup(x,y,anim,now){

 ctx.save();

 ctx.strokeStyle='rgba(255,248,230,0.85)';ctx.lineWidth=1.8;ctx.lineCap='round';ctx.shadowBlur=4;
 for(const ox of [-5,0,5]){
  const sway=Math.sin(now*.012+ox)*3;
  ctx.beginPath();ctx.moveTo(cx+ox,cy-8);
  ctx.quadraticCurveTo(cx+ox+sway,cy-14,cx+ox-sway*.7,cy-20);ctx.stroke();
 }
 ctx.shadowColor='#0008';ctx.shadowBlur=6;
 ctx.fillStyle='#e5dccb';
 ctx.beginPath();ctx.ellipse(cx,cy+7,13,3.5,0,0,Math.PI*2);ctx.fill();

 ctx.quadraticCurveTo(cx+8,cy+6,cx,cy+6);

 ctx.closePath();ctx.fill();

function drawStar(x,y,radius,spin=0,outer='#55bcff',inner='#eef8ff',glow='#4db5ff',blur=12,outerW=2.8,innerW=1.2){
 ctx.save();
 ctx.translate(x,y);ctx.rotate(spin);
 ctx.shadowColor=glow;ctx.shadowBlur=blur;
 for(const [stroke,width] of [[outer,outerW],[inner,innerW]]){
  ctx.strokeStyle=stroke;ctx.lineWidth=width;
  for(const rotation of [-Math.PI/2,Math.PI/2]){
   ctx.beginPath();
   for(let k=0;k<3;k++){
    const a=rotation+k*2*Math.PI/3;
    const px=radius*Math.cos(a),py=radius*Math.sin(a);
    if(k===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
   }
   ctx.closePath();ctx.stroke();
  }
 }
 ctx.restore();
}

function drawSuperBeam(beam,now){
 const progress=1-beam.ttl/(beam.max||28);
 const alpha=Math.min(1,beam.ttl/10);
 const pulse=.88+.12*Math.sin(now*.04);
 const dx=beam.tx-beam.sx,dy=beam.ty-beam.sy,dist=Math.hypot(dx,dy)||1;
 const ux=dx/dist,uy=dy/dist;
 const starX=beam.sx+ux*Math.min(54,dist*.32),starY=beam.sy+uy*Math.min(54,dist*.32);

 ctx.save();
 ctx.lineCap='round';
 ctx.strokeStyle=`rgba(56,168,255,${.36*alpha})`;
 ctx.lineWidth=(38*pulse)*(.55+.45*alpha);
 ctx.shadowColor='#3da9ff';ctx.shadowBlur=28;
 ctx.beginPath();ctx.moveTo(starX,starY);ctx.lineTo(beam.tx,beam.ty);ctx.stroke();
 ctx.strokeStyle=`rgba(130,220,255,${.85*alpha})`;
 ctx.lineWidth=17*pulse*alpha;ctx.shadowColor='#8ee0ff';ctx.shadowBlur=18;
 ctx.beginPath();ctx.moveTo(starX,starY);ctx.lineTo(beam.tx,beam.ty);ctx.stroke();
 ctx.strokeStyle=`rgba(255,255,255,${.98*alpha})`;
 ctx.lineWidth=6.5*alpha;ctx.shadowBlur=10;
 ctx.beginPath();ctx.moveTo(starX,starY);ctx.lineTo(beam.tx,beam.ty);ctx.stroke();

 const shockR=28+progress*72;
 const burst=ctx.createRadialGradient(beam.tx,beam.ty,2,beam.tx,beam.ty,52*pulse);
 burst.addColorStop(0,`rgba(255,255,255,${.95*alpha})`);
 burst.addColorStop(.35,`rgba(118,214,255,${.75*alpha})`);
 burst.addColorStop(1,'rgba(56,168,255,0)');
 ctx.fillStyle=burst;ctx.beginPath();ctx.arc(beam.tx,beam.ty,52*pulse,0,Math.PI*2);ctx.fill();

 ctx.strokeStyle=`rgba(170,234,255,${.85*alpha})`;
 ctx.lineWidth=3.5*alpha;ctx.beginPath();ctx.arc(beam.tx,beam.ty,shockR,0,Math.PI*2);ctx.stroke();
 ctx.restore();

 ctx.save();ctx.globalAlpha=alpha;
 const aura=ctx.createRadialGradient(starX,starY,4,starX,starY,44*pulse);
 aura.addColorStop(0,'rgba(255,255,255,0.92)');
 aura.addColorStop(.45,'rgba(92,192,255,0.55)');
 aura.addColorStop(1,'rgba(46,144,255,0)');
 ctx.fillStyle=aura;ctx.beginPath();ctx.arc(starX,starY,44*pulse,0,Math.PI*2);ctx.fill();
 drawStar(starX,starY,29*pulse,now*.009,'#3baeff','#ffffff','#5cc4ff',26,5.2,2.4);
 drawStar(starX,starY,15*pulse,-now*.012,'#ffe484','#ffffff','#ffd257',14,2.6,1.2);
 ctx.restore();
}

function drawGloss(r,tint='rgba(6,18,32,0.34)'){
 const shade=ctx.createRadialGradient(-r*.34,-r*.38,r*.12,0,0,r);
 shade.addColorStop(0,'rgba(255,255,255,0.22)');
 shade.addColorStop(.55,'rgba(255,255,255,0)');
 shade.addColorStop(1,tint);
 ctx.fillStyle=shade;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
 const spec=ctx.createRadialGradient(-r*.36,-r*.44,r*.04,-r*.32,-r*.38,r*.52);
 spec.addColorStop(0,'rgba(255,255,255,0.48)');
 spec.addColorStop(.55,'rgba(255,255,255,0.08)');
 spec.addColorStop(1,'rgba(255,255,255,0)');
 ctx.fillStyle=spec;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
}

 ownHpText.textContent=self+' / '+me.maxHP;
 enemyHpText.textContent=rival+' / '+foe.maxHP;
 ownFill.style.width=selfPct+'%';ownGhost.style.width=selfPct+'%';
 enemyFill.style.width=foePct+'%';enemyGhost.style.width=foePct+'%';

 if(!self||!rival){
  if(!finished){
   finished=true;clearInterval(timer);
   phasePill.textContent='KONIEC';phasePill.className='phase-pill done';
   const won=self>0,draw=!self&&!rival;
   const elapsedSec=roundStarted?Math.max(1,Math.round((Date.now()-roundStarted)/1000)):0;
   msg.textContent=won?'Wygrywasz pojedynek!':draw?'Remis!':'Przegrywasz pojedynek.';
   resultTitle.textContent=won?'Zwycięstwo!':draw?'Remis!':'Porażka';
   resultSub.textContent=fighterLabel(me)+' ('+self+' HP) vs '+fighterLabel(foe)+' ('+rival+' HP)'+(elapsedSec?' · '+elapsedSec+' s':'');
   resultCard.className='result-card'+(won?'':draw?' draw':' lose');
   resultOverlay.classList.add('show');
   beep(won?520:240,.22,'triangle',.07,won?780:140);
  }
 }
}

function countdown(left){
 aiming=left>0;
 if(aiming){
  const s=Math.ceil(left/1000);
  phasePill.textContent='CELOWANIE · '+s+'S';
  phasePill.className='phase-pill aim';
  msg.textContent='Wybierz kierunek wystrzału · '+s+' s';
 }else{
  if(!roundStarted)roundStarted=Date.now();
  phasePill.textContent='WALKA';
  phasePill.className='phase-pill live';
  msg.textContent='Kulki w ruchu — trwa pojedynek';
 }
}

function soloRound(){
 const ps=fresh();selectFighter(ps[0],selected);
 const botId=FIGHTER_IDS[Math.floor(Math.random()*FIGHTER_IDS.length)];
 selectFighter(ps[1],botId);
 ps[1].angle=Math.PI+(Math.random()-.5)*1.8;
 deadline=performance.now()+5000;countdown(5000);render(ps);
 timer=setInterval(()=>{
  const left=Math.max(0,deadline-performance.now());
  if(aiming&&!left){ps[0].angle=angle;launch(ps);beep(440,.1,'sine',.05,660);}
  countdown(left);if(!left)step(ps);render(ps);
 },32);
}

function start(next){
 clearInterval(timer);if(ws){ws.onmessage=ws.onclose=null;ws.close();ws=null;}
 aiming=false;angle=0;mode=next;seat=0;finished=false;roundStarted=0;
 lastHP=[0,0];flash=[0,0];shake=0;sparks=[];pickerNote.textContent='';
 resultOverlay.classList.remove('show');
 const init=fresh();selectFighter(init[0],selected);render(init);
 solo.setAttribute('aria-pressed',String(mode==='solo'));
 online.setAttribute('aria-pressed',String(mode==='online'));
 if(mode==='solo'){soloRound();return;}
 phasePill.textContent='ŁĄCZENIE';phasePill.className='phase-pill';
 msg.textContent='Łączenie z areną online…';
 ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/api/balls');
 ws.onmessage=e=>{
  const v=JSON.parse(e.data);
  if(v==='waiting'){phasePill.textContent='POCZEKALNIA';msg.textContent='Szukamy drugiego gracza…';return;}
  if(v.seat!==undefined){seat=v.seat;ws.send(selected);angle=v.ps[seat].angle;deadline=performance.now()+v.left;}
  countdown(v.left);render(v.ps);
 };
 ws.onclose=()=>{
  aiming=false;
  if(!finished){
   phasePill.textContent='ROZŁĄCZONO';phasePill.className='phase-pill done';
   msg.textContent='Połączenie zostało zakończone.';
   resultTitle.textContent='Rozłączono';
   resultSub.textContent='Serwer zakończył połączenie lub rywal opuścił arenę.';
   resultCard.className='result-card draw';
   resultOverlay.classList.add('show');
  }
 };
}

solo.onclick=()=>start('solo');
online.onclick=()=>start('online');
again.onclick=()=>start(mode||'solo');
dismissResult.onclick=()=>resultOverlay.classList.remove('show');

function aim(value){
 if(!aiming||performance.now()>=deadline)return;
 angle=Math.atan2(Math.sin(value),Math.cos(value));
 if(ws?.readyState===1)ws.send(String(angle));
 render(current);
}
function point(e){
 const r=canvas.getBoundingClientRect(),p=current[seat];
 aim(Math.atan2((e.clientY-r.top)*480/r.height-p.y,(e.clientX-r.left)*800/r.width-p.x));
}
canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);point(e);};
canvas.onpointermove=e=>{if(e.buttons)point(e);};
addEventListener('keydown',e=>{
 if(!aiming||!['ArrowLeft','ArrowRight'].includes(e.key))return;
 e.preventDefault();aim(angle+(e.key==='ArrowLeft'?-1:1)*Math.PI/36);
});

function preview(){
 const ps=fresh();selectFighter(ps[0],selected);lastHP=[0,0];flash=[0,0];sparks=[];render(ps);
}
function chooseFighter(id){
 selected=id;
 cards.forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.fighter===id)));
 if(!mode||finished){
  pickerNote.textContent='';
  resultOverlay.classList.remove('show');
  preview();
 }else if(aiming&&ws?.readyState===1){
  ws.send(selected);
  pickerNote.textContent='Postać zaktualizowana przed startem!';
 }else{
  pickerNote.textContent='Nowa postać wejdzie w następnej rundzie';
 }
}
cards.forEach(c=>c.addEventListener('click',()=>chooseFighter(c.dataset.fighter)));
chooseFighter(selected);
phasePill.textContent='GOTOWY';
msg.textContent='Wybierz postać i rozpocznij pojedynek solo lub online.';
</script>
</body>
</html>
